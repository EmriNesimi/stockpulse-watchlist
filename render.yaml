# Render Blueprint — the deploy config lives here rather than in dashboard
# forms so it is reviewable and survives someone rebuilding the services.
#
# Create with: Render dashboard -> New -> Blueprint -> pick this repo.
# Render prompts for every var marked `sync: false`; none of those values
# are ever committed here.

services:
  - type: web
    name: stockpulse-api
    runtime: node
    plan: free
    region: oregon # must match stockpulse-db, or the internal DB host will not resolve
    rootDir: backend
    # --include=dev is load-bearing: NODE_ENV=production below makes npm skip
    # devDependencies, and the build needs them — typescript, the prisma CLI
    # and every @types/* package. Without it tsc compiles with no type
    # declarations at all and dies on hundreds of implicit-any errors.
    #
    # migrate:deploy is deliberately not part of `npm run build` — CI runs
    # build, and CI has no business migrating the production database.
    buildCommand: npm ci --include=dev && npm run build && npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Resolves to the *internal* connection string automatically, which is
      # what we want: it never leaves Render's network and does not burn one
      # of the database's external connection slots.
      - key: DATABASE_URL
        fromDatabase:
          name: stockpulse-db
          property: connectionString
      # Must match the static site's live URL exactly or CORS rejects it.
      - key: FRONTEND_ORIGIN
        value: https://stockpulse-b449.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: MASSIVE_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: StockPulse <onboarding@resend.dev>

  - type: web
    runtime: static
    # Render appended -b449 because the bare name was already taken globally;
    # the live host is stockpulse-b449.onrender.com, which FRONTEND_ORIGIN above
    # must keep matching.
    name: stockpulse
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # The verification email links to /verify-email?token=..., and a static
    # site has no file at that path — clicking it returned a 404. There is no
    # client-side router; App.tsx just reads ?token= off the query string, so
    # serving index.html for any path is all that is needed.
    # helmet only covers the API origin. The static site is served by Render,
    # so its headers have to be declared here or the app ships with none —
    # and frame-ancestors cannot be set from a <meta> CSP, only a real header.
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # No scheme is available from a fromService reference, and src/lib/ws.ts
      # derives the socket URL from this by swapping http -> ws, so it needs
      # the full origin with no trailing slash.
      - key: VITE_API_URL
        value: https://stockpulse-api-n3yu.onrender.com
