version: 2

# CI already fails the build on a high-severity advisory (npm audit in
# ci.yml), but that only tells us something is wrong after the fact. These
# keep the lockfiles moving so advisories get fixed before they bite.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the Node major we actually run, not the newest
      # release. Types ahead of the runtime would let TypeScript accept calls
      # that don't exist at execution time. Bump this with the Node baseline.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # cookie v2 renamed `parse` to `parseCookie` and publishes its types
      # only through an "exports" map, which this package's `moduleResolution:
      # node` can't read. Taking it means migrating the backend to node16
      # resolution (explicit .js extensions on every relative dynamic import),
      # which isn't worth it for a dependency with no outstanding advisory.
      # Revisit alongside that migration.
      - dependency-name: "cookie"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for the routine patch/minor churn; majors still come through
      # individually so breaking changes get read properly.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # jsdom 28+ pulls an undici that calls webidl.util.markAsUncloneable,
      # a Node 22 API. On the pinned Node 20 the whole suite fails to
      # collect. Unblocks when the Node baseline moves.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
