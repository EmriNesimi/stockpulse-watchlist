name: Smoke

# Deploys happen outside CI — Render builds from main on its own — so nothing
# was checking the result. This runs after a push to main lands (giving Render
# time to finish), and daily, because the two things most likely to break the
# deployment break it without anyone pushing: a hostname changing and the free
# database expiring.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Deployed app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Retried rather than waited-then-run. The previous version waited for
      # /health to answer, which the *old* instance does perfectly well while
      # the new one is still building — so a push could be smoke-tested against
      # the build it was replacing and pass for the wrong reason.
      #
      # There's no reliable way from outside to ask which commit is live, so
      # this retries until the deployed app agrees with the checked-out
      # scripts, and only fails once it's had long enough that a stuck deploy
      # is the likelier explanation.
      - name: Smoke test
        run: |
          for attempt in $(seq 1 12); do
            if ./scripts/smoke.sh; then
              echo "passed on attempt $attempt"
              exit 0
            fi
            echo "::notice::attempt $attempt did not pass — the deploy may still be rolling out"
            sleep 30
          done

          echo "::error::the deployed app still doesn't match this commit after ~6 minutes"
          ./scripts/smoke.sh
