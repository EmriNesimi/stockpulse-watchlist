name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Grep for likely committed secrets
        run: |
          set -e
          # Backstop to GitHub's native secret scanning: fail if a real-looking
          # MASSIVE_API_KEY or generic API key assignment shows up in tracked files.
          if git grep -nE "MASSIVE_API_KEY\s*=\s*[A-Za-z0-9_\-]{16,}" -- . ':!.github/workflows/*'; then
            echo "::error::Possible committed secret matching MASSIVE_API_KEY=<value> pattern"
            exit 1
          fi
          if find . -name "*.db" -not -path "./node_modules/*" | grep -q .; then
            echo "::error::A .db file is tracked in the repo — SQLite data files must never be committed"
            exit 1
          fi
          # No .env files at all in this repo, not even an example template —
          # fail loudly if one ever gets committed, intentionally or not.
          if git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$'; then
            echo "::error::A .env-pattern file is tracked in the repo — none are allowed, not even .env.example"
            exit 1
          fi
          echo "No obvious secrets, database files, or .env files found."

  backend:
    name: Backend (typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Audit (high severity)
        run: npm audit --audit-level=high

  frontend:
    name: Frontend (typecheck, build, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Audit (high severity)
        run: npm audit --audit-level=high
