name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Grep for likely committed secrets
        run: |
          set -e
          # Backstop to GitHub's native secret scanning: fail if a real-looking
          # MASSIVE_API_KEY or generic API key assignment shows up in tracked files.
          if git grep -nE "MASSIVE_API_KEY\s*=\s*[A-Za-z0-9_\-]{16,}" -- . ':!.github/workflows/*'; then
            echo "::error::Possible committed secret matching MASSIVE_API_KEY=<value> pattern"
            exit 1
          fi
          if find . -name "*.db" -not -path "./node_modules/*" | grep -q .; then
            echo "::error::A .db file is tracked in the repo — SQLite data files must never be committed"
            exit 1
          fi
          # No .env files at all in this repo, not even an example template —
          # fail loudly if one ever gets committed, intentionally or not.
          if git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$'; then
            echo "::error::A .env-pattern file is tracked in the repo — none are allowed, not even .env.example"
            exit 1
          fi
          echo "No obvious secrets, database files, or .env files found."

  backend:
    name: Backend (typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The suite talks to a real database rather than mocking Prisma, so CI
    # needs one. globalSetup drops and recreates the schema each run, which is
    # only safe because this container is thrown away with the job.
    services:
      postgres:
        # Matches the Render instance this deploys to. Testing against a
        # different major than production runs is a bet, not a plan.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stockpulse_test
      - name: Audit (high severity)
        run: npm audit --audit-level=high

  frontend:
    name: Frontend (typecheck, build, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Audit (high severity)
        run: npm audit --audit-level=high
