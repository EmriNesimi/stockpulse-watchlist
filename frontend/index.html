<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Real-time stock watchlist — live prices over WebSocket, price alerts, and a portfolio view that shows a dash rather than a number it can't compute yet."
    />
    <!-- Matches the app's own violet so mobile browsers tint their chrome to
         match rather than defaulting to white. -->
    <meta name="theme-color" content="#8044fe" />

    <!-- Without these a shared link renders as a bare URL with no title,
         summary or image on every platform that reads them. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StockPulse — real-time stock watchlist" />
    <meta
      property="og:description"
      content="Live prices over WebSocket, price alerts the moment they fire, and a candlestick view for every symbol you track."
    />
    <meta property="og:url" content="https://stockpulse-b449.onrender.com" />
    <meta name="twitter:card" content="summary" />

    <title>StockPulse — real-time stock watchlist</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
